[project]
name = "shared"
version = "0.1.0"
description = "Shared infrastructure: persistence, messaging, LLM, observability, contracts"
requires-python = ">=3.12"
dependencies = [
    # PostgreSQL async
    "sqlalchemy>=2.0.50",
    "asyncpg>=0.30",
    "alembic>=1.15",
    # NATS
    "nats-py>=2.7",
    # LLM providers
    "litellm>=1.82",
    "httpx>=0.27",
    # Observability
    "langfuse>=3.0",
    "opentelemetry-sdk>=1.33",
    "opentelemetry-exporter-otlp>=1.33",
    # Validation & config
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Logging
    "loguru>=0.7",
    # S3 / MinIO artifact storage (Phase 5)
    "aiobotocore>=2.13",
    "boto3>=1.35",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
