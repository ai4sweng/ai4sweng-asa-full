[project]
name = "enisalimerge"
version = "0.1.0"
description = "EnisAliMerge — AI4SWEng KIO1 unified platform"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["shared", "apps/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
asyncio_mode = "auto"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.coverage.run]
source = ["shared", "apps"]
omit = ["tests/*", "shared/migrations/*"]
