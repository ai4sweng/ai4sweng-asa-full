version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/shared"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/apps/orchestrator"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/apps/session_manager"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/apps/kio_shells"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/dashboard"
    schedule:
      interval: "weekly"
    groups:
      dashboard-deps:
        patterns: ["*"]
