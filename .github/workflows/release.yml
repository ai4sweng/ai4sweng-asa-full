name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  REGISTRY: ghcr.io
  ORG: ai4sweng

jobs:
  # ── Build & push all service images ─────────────────────────────────────────
  publish:
    name: Publish ${{ matrix.kio_id || matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Core services
          - service: orchestrator
            image: orchestrator
            dockerfile: apps/orchestrator/Dockerfile
          - service: session_manager
            image: session-manager
            dockerfile: apps/session_manager/Dockerfile
          - service: lm_engine
            image: lm-engine
            dockerfile: apps/lm_engine/Dockerfile
          # KIO shells — one image per KIO_ID
          - service: kio_shells
            kio_id: kio1
            image: kio1
            dockerfile: apps/kio_shells/Dockerfile
          - service: kio_shells
            kio_id: kio2
            image: kio2
            dockerfile: apps/kio_shells/Dockerfile
          - service: kio_shells
            kio_id: kio3
            image: kio3
            dockerfile: apps/kio_shells/Dockerfile
          - service: kio_shells
            kio_id: kio4
            image: kio4
            dockerfile: apps/kio_shells/Dockerfile
          - service: kio_shells
            kio_id: kio5
            image: kio5
            dockerfile: apps/kio_shells/Dockerfile
          - service: kio_shells
            kio_id: kio6
            image: kio6
            dockerfile: apps/kio_shells/Dockerfile
          - service: kio_shells
            kio_id: kio7
            image: kio7
            dockerfile: apps/kio_shells/Dockerfile
          - service: kio_shells
            kio_id: kio8
            image: kio8
            dockerfile: apps/kio_shells/Dockerfile
          - service: kio_shells
            kio_id: kio9
            image: kio9
            dockerfile: apps/kio_shells/Dockerfile
          - service: kio_shells
            kio_id: kio10
            image: kio10
            dockerfile: apps/kio_shells/Dockerfile
          - service: kio_shells
            kio_id: kio11
            image: kio11
            dockerfile: apps/kio_shells/Dockerfile
          - service: kio_shells
            kio_id: kio12
            image: kio12
            dockerfile: apps/kio_shells/Dockerfile
          - service: kio_shells
            kio_id: kio13
            image: kio13
            dockerfile: apps/kio_shells/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KIO_ID=${{ matrix.kio_id || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ── Create GitHub Release with changelog ────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "$PREV_TAG"..HEAD --oneline --no-merges)
          else
            CHANGES=$(git log --oneline --no-merges | head -20)
          fi
          {
            echo "notes<<EOF"
            echo "## What's changed"
            echo ""
            echo "$CHANGES"
            echo ""
            echo "## Images"
            echo ""
            echo "All images published to \`ghcr.io/ai4sweng/<service>:${GITHUB_REF_NAME}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
