name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check shared/ apps/ --output-format=github

      - name: Ruff format check
        run: ruff format --check shared/ apps/

  # ── Type check ──────────────────────────────────────────────────────────────
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv venv .venv --python ${{ env.PYTHON_VERSION }}
          uv pip install --python .venv/bin/python \
            "mypy>=1.10" \
            "fastapi>=0.115" \
            "pydantic>=2.0" \
            "pydantic-settings>=2.0" \
            "loguru>=0.7" \
            "sqlalchemy>=2.0" \
            "nats-py>=2.7" \
            "langgraph>=0.2.0" \
            "httpx>=0.27"

      - name: mypy — shared
        run: .venv/bin/mypy shared/ --ignore-missing-imports --no-error-summary
        continue-on-error: true  # advisory — remove once type coverage improves

      - name: mypy — orchestrator
        run: .venv/bin/mypy apps/orchestrator/src/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  # ── Unit tests ──────────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: enisalimerge
          POSTGRES_PASSWORD: enisalimerge
          POSTGRES_DB: enisalimerge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enisalimerge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "wget -qO- http://localhost:8222/healthz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        # NATS monitoring port — needed for healthcheck
        env:
          CMD_ARGS: "--jetstream -m 8222"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install project + dev dependencies
        run: |
          uv venv .venv --python ${{ env.PYTHON_VERSION }}
          uv pip install --python .venv/bin/python \
            "loguru>=0.7" \
            "fastapi>=0.115" \
            "uvicorn[standard]>=0.30" \
            "httpx>=0.27" \
            "langgraph>=0.2.0" \
            "langgraph-checkpoint-postgres>=2.0" \
            "psycopg[binary]>=3.1" \
            "psycopg-pool>=3.2" \
            "pyjwt>=2.8" \
            "bcrypt>=4.0" \
            "sqlalchemy>=2.0" \
            "asyncpg>=0.30" \
            "alembic>=1.15" \
            "nats-py>=2.7" \
            "litellm>=1.82" \
            "pydantic>=2.0" \
            "pydantic-settings>=2.0" \
            "greenlet>=3.0" \
            "pytest>=8.0" \
            "pytest-asyncio>=0.24" \
            "pytest-cov>=5.0"

      - name: Run DB migrations
        env:
          DATABASE_URL: postgresql+asyncpg://enisalimerge:enisalimerge@localhost:5432/enisalimerge
        run: |
          cd apps/session_manager
          PYTHONPATH=../../ ../../.venv/bin/alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://enisalimerge:enisalimerge@localhost:5432/enisalimerge
          NATS_URL: nats://localhost:4222
          JWT_SECRET_KEY: ci-test-secret-key-not-used-in-production-32chars
          PYTHONPATH: ${{ github.workspace }}
        run: |
          .venv/bin/pytest tests/ \
            --cov=shared --cov=apps \
            --cov-report=xml \
            --cov-report=term-missing \
            -v --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ── Docker build (smoke) ─────────────────────────────────────────────────────
  build:
    name: Docker build — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        service:
          - orchestrator
          - session_manager
          - lm_engine
          - kio_shells

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            KIO_ID=kio3
