[project]
name = "orchestrator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "loguru>=0.7",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[asyncio,binary]>=3.1",
    "psycopg-pool>=3.2",
    "pyjwt>=2.8",
    "bcrypt>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
